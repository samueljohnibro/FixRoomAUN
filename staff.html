    <div class="header-left">
        <img src="assets/fixroomaunlogowtext.png" alt="FixRoomAUN Logo">
    </div>

    <nav class="dashboard-nav" aria-label="Primary navigation">
        <a class="nav-tab active" href="staff.html" aria-current="page">Home</a>
        <a class="nav-tab" href="analytics.html">Analytics</a>
    </nav>

    <div class="header-right">
        <div class="header-account-group">
            <span id="staffEmail"></span>
            <div id="accountSwitcher" class="account-switch-container"></div>
        </div>
        <button id="logoutBtn" class="secondary-btn" type="button">Logout</button>
    </div>

</header>

<div class="dashboard-container">

    <h2>Maintenance Requests</h2>

    <!-- FILTER -->
    <select id="statusFilter" aria-label="Filter maintenance requests by status">
        <option value="all">All Tickets</option>
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
        <option value="Closed">Closed</option>
        <option value="Cancelled">Cancelled</option>
    </select>

    <div id="staffTicketList" class="ticket-list"></div>

</div>

<script src="js/localStore.js"></script>
