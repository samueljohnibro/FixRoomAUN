<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060b14">
    <meta name="color-scheme" content="dark">
    <title>FixRoomAUN - Maintenance Staff</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="assets/fixroomaunlogo.png">
</head>
<body>

<header class="dashboard-header">

    <div class="header-left">
        <img src="assets/fixroomaunlogowtext.png" alt="FixRoomAUN Logo">
    </div>

    <nav class="dashboard-nav" aria-label="Primary navigation">
        <a class="nav-tab active" href="staff.html" aria-current="page">Home</a>
        <a class="nav-tab" href="analytics.html">Analytics</a>
    </nav>

    <div class="header-right">
        <span id="staffEmail"></span>
        <button id="logoutBtn" class="secondary-btn" type="button">Logout</button>
    </div>

</header>

<div class="dashboard-container">

    <h2>Maintenance Requests</h2>

    <!-- FILTER -->
    <select id="statusFilter" aria-label="Filter maintenance requests by status">
        <option value="all">All Tickets</option>
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
        <option value="Closed">Closed</option>
        <option value="Cancelled">Cancelled</option>
    </select>

    <div id="staffTicketList" class="ticket-list"></div>

</div>

<script src="js/localStore.js"></script>
<script src="js/staff.js"></script>

</body>
</html>
